<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Fall · 调试台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: rgb(251,250,244); font-family: ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; }

  #loader {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 140px; height: 6px; z-index: 40;
    transition: opacity 250ms cubic-bezier(0.25,1,0.5,1);
  }
  #loader .track { position: relative; width: 100%; height: 100%; border-radius: 999px; overflow: hidden; background: rgba(21,23,23,0.10); }
  #loader .fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 999px; background: rgba(21,23,23,0.85);
    transition: width 520ms cubic-bezier(0.22,1,0.36,1); will-change: width; }
  #loader.done { opacity: 0; pointer-events: none; }

  /* 调试提示 */
  #tip {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font: 11px/1.5 ui-monospace, Menlo, monospace; color: rgba(21,23,23,0.4);
    pointer-events: none; user-select: none; max-width: 320px;
  }
  /* lil-gui 微调位置/字号 */
  .lil-gui { --width: 300px; font-size: 12px; z-index: 50; }
  .lil-gui.root > .title { font-weight: 600; }
  #status{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:rgba(21,23,23,0.92);color:#fff;font:13px/1.45 ui-sans-serif,system-ui,sans-serif;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:82vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);}
  #status.show{opacity:1;}
</style>
</head>
<body>
<div id="loader"><div class="track"><div class="fill" id="loaderFill"></div></div></div>
<div id="tip">右上角面板可实时调参 · 移动鼠标画面扭曲跟随 · 点击空白处爆发贴纸</div>
<div id="status"></div>
<input id="stickerUpload" type="file" accept="image/*" multiple style="display:none">
<input id="stickerFolder" type="file" accept="image/*" webkitdirectory directory multiple style="display:none">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "lil-gui": "./vendor/lil-gui.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';

/* ============================================================
 *  参数
 * ============================================================ */
const P = {
  // —— 相机 ——
  fov:         56,      // 相机视场

  // —— 贴纸系统 ——
  ambientCount: 48,     // 场景中常驻贴纸总数
  stickerSize:  1.0,    // 单个贴纸尺寸（实时缩放所有贴纸）
  sizeVariance: 0.4,    // 贴纸大小随机度 0..1
  fallSpeed:    2.1,
  windStrength: 1.1,
  burstCount:   14,
  stickerCount: 12,   // 当前贴纸种类数（上传后变化，只读显示）
  // —— 背景扭曲 ——
  mixRadius:    0.72,
  amplitude:    0.55
};

/* ============================================================
 *  渲染器 / 场景 / FBO
 * ============================================================ */
const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xfbfaf4);

const camera=new THREE.PerspectiveCamera(P.fov,innerWidth/innerHeight,0.1,200);
camera.position.set(0,0,30);
camera.lookAt(0,0,0);

const fbo=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{samples:4});

/* ============================================================
 *  贴纸系统
 * ============================================================ */
/* —— 贴纸图集：默认 12 款程序化 + 运行时整体替换上传图片。纹理上限 2048² —— */
const COLS=4, ROWS=4, CELL=512, MAX_STICKERS=COLS*ROWS;   // 2048×2048，最多 16 格
let atlasCanvas=null, atlasCtx=null;     // makeStickerAtlas 内赋值，供 rebuildAtlas 重绘
let drawDefault=null;                    // makeStickerAtlas 内赋值：绘制默认 12 款到指定 ctx
let customImages=[];                     // 非空时整体替换默认 12 款
function totalStickers(){ return customImages.length>0 ? customImages.length : 12; }

function makeStickerAtlas(){
  const c=document.createElement('canvas');c.width=COLS*CELL;c.height=ROWS*CELL;
  const ctx=c.getContext('2d');atlasCanvas=c;atlasCtx=ctx;
  const INK='#1c1c1c',GREEN='#7fb069',PINE='#2d4a3e',CREAM='#f0efe9',RUST='#c96f4a';
  const circle=(g,r)=>g.arc(0,0,r,0,Math.PI*2);
  const blob=(g,r)=>{g.moveTo(r,0);for(let a=0;a<=Math.PI*2+0.1;a+=Math.PI/5){const rr=r*(0.82+0.18*Math.sin(a*3));g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}};
  const star5=(g,r)=>{for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*0.45:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();};
  const square=(g,r)=>{const s=r*0.9;g.roundRect(-s,-s,s*2,s*2,s*0.35);};
  const diamond=(g,r)=>{g.moveTo(0,-r);g.lineTo(r*0.8,0);g.lineTo(0,r);g.lineTo(-r*0.8,0);g.closePath();};
  const heart=(g,r)=>{g.moveTo(0,r*0.7);g.bezierCurveTo(-r*1.3,-r*0.3,-r*0.5,-r*1.1,0,-r*0.35);g.bezierCurveTo(r*0.5,-r*1.1,r*1.3,-r*0.3,0,r*0.7);};
  const painters=[
    (x,y)=>{stickerBase(ctx,CELL,x,y,blob);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);[[-58,0],[58,0]].forEach(([ex])=>{ctx.beginPath();ctx.arc(ex,0,62,0,Math.PI*2);ctx.fillStyle=GREEN;ctx.fill();ctx.beginPath();ctx.arc(ex+8,0,40,0,Math.PI*2);ctx.fillStyle=INK;ctx.fill();ctx.beginPath();ctx.moveTo(ex-12,-30);ctx.lineTo(ex+22,0);ctx.lineTo(ex-12,30);ctx.closePath();ctx.fillStyle=CREAM;ctx.fill();});ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();star5(ctx,95);ctx.fillStyle=RUST;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,square);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();ctx.moveTo(20,-95);ctx.lineTo(-45,10);ctx.lineTo(0,10);ctx.lineTo(-20,95);ctx.lineTo(45,-10);ctx.lineTo(0,-10);ctx.closePath();ctx.fillStyle=GREEN;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();heart(ctx,90);ctx.fillStyle=RUST;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.fillStyle=INK;[[-45,-30],[45,-30]].forEach(([ex,ey])=>{ctx.beginPath();ctx.arc(ex,ey,14,0,Math.PI*2);ctx.fill();});ctx.beginPath();ctx.arc(0,10,55,0.15*Math.PI,0.85*Math.PI);ctx.lineWidth=10;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.beginPath();ctx.ellipse(0,-62,30,46,0,0,Math.PI*2);ctx.fillStyle=GREEN;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fillStyle=RUST;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();ctx.arc(10,0,80,0,Math.PI*2);ctx.fillStyle=PINE;ctx.fill();ctx.beginPath();ctx.arc(45,-15,68,0,Math.PI*2);ctx.fillStyle=CREAM;ctx.fill();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();ctx.arc(0,0,58,0,Math.PI*2);ctx.fillStyle=RUST;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4);ctx.beginPath();ctx.moveTo(70,0);ctx.lineTo(105,0);ctx.lineWidth=9;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,blob);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.lineWidth=14;ctx.lineCap='round';ctx.strokeStyle=PINE;[-40,0,40].forEach(oy=>{ctx.beginPath();for(let px=-90;px<=90;px+=6){const py=oy+Math.sin(px*0.05)*16;px===-90?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();});ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,square);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);[[-52,-52,GREEN],[8,-52,INK],[-52,8,INK],[8,8,RUST]].forEach(([gx,gy,col])=>{ctx.beginPath();ctx.roundRect(gx,gy,44,44,8);ctx.fillStyle=col;ctx.fill();});ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,circle);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();ctx.moveTo(0,-85);ctx.lineTo(80,60);ctx.lineTo(-80,60);ctx.closePath();ctx.fillStyle=GREEN;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.beginPath();ctx.arc(0,10,18,0,Math.PI*2);ctx.fillStyle=CREAM;ctx.fill();ctx.restore();},
    (x,y)=>{stickerBase(ctx,CELL,x,y,diamond);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);[70,45,20].forEach((r,i)=>{ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=[PINE,CREAM,RUST][i];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();});ctx.restore();}
  ];
  function stickerBase(ctx,CELL,x,y,shape){ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.beginPath();shape(ctx,190);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=10;ctx.strokeStyle=INK;ctx.stroke();ctx.beginPath();shape(ctx,150);ctx.fillStyle=CREAM;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}
  drawDefault=(g)=>{painters.forEach((fn,i)=>{const col=i%COLS,row=Math.floor(i/COLS);fn(col*CELL,row*CELL);});g.globalAlpha=0.05;for(let i=0;i<9000;i++){g.fillStyle=Math.random()<0.5?'#000':'#fff';g.fillRect(Math.random()*g.canvas.width,Math.random()*g.canvas.height,2,2);}g.globalAlpha=1;};
  drawDefault(ctx);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return tex;
}

const atlas=makeStickerAtlas();
const MAX=2048;
const stickerMat=new THREE.ShaderMaterial({
  uniforms:{uAtlas:{value:atlas}},
  vertexShader:`attribute float aIdx;attribute float aOp;varying vec2 vUv;varying float vI;varying float vO;
    void main(){vUv=uv;vI=aIdx;vO=aOp;gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D uAtlas;varying vec2 vUv;varying float vI;varying float vO;
    void main(){float col=mod(vI,4.0);float row=floor(vI/4.0);vec2 uv=(vUv+vec2(col,row))/vec2(4.0,4.0);
    vec4 c=texture2D(uAtlas,uv);if(c.a*vO<0.02)discard;gl_FragColor=vec4(c.rgb,c.a*vO);}`,
  transparent:true,depthWrite:false,side:THREE.DoubleSide
});
const sGeo=new THREE.PlaneGeometry(1,1);
const sMesh=new THREE.InstancedMesh(sGeo,stickerMat,MAX);
sMesh.frustumCulled=false;sMesh.count=0;scene.add(sMesh);
const aIdx=new Float32Array(MAX),aOp=new Float32Array(MAX).fill(1);
sGeo.setAttribute('aIdx',new THREE.InstancedBufferAttribute(aIdx,1));
sGeo.setAttribute('aOp',new THREE.InstancedBufferAttribute(aOp,1));

const particles=[];let emitClock=0;const dummy=new THREE.Object3D();
function visibleBounds(){const h=2*Math.tan(THREE.MathUtils.degToRad(P.fov/2))*camera.position.z;return {w:h*camera.aspect,h};}
function spawn(origin,isOneShot){
  const b=visibleBounds();const spread=isOneShot?3.2:1;const p={
    originX:isOneShot?origin.x+(Math.random()-0.5)*spread*2:(Math.random()-0.5)*b.w*1.15,
    originY:isOneShot?origin.y+(Math.random()-0.5)*spread*2:b.h/2+4,
    originZ:(Math.random()-0.5)*5,
    fallSpeed:P.fallSpeed*(0.45+Math.random()*1.1),
    rotation:Math.random()*Math.PI*2,rotationSpeed:(Math.random()-0.5)*0.9*2,
    scaleBase:(isOneShot?0.85:1.1)*(1+(Math.random()-0.5)*2*P.sizeVariance),  // 基础大小(含随机度)，实时由 P.stickerSize 缩放
    windPhase:Math.random()*Math.PI*2,windAmplitude:0.3+Math.random()*P.windStrength,
    idx:Math.floor(Math.random()*totalStickers()),isOneShot,dead:false,hasStarted:true,
    emitAt:emitClock++,bornAt:performance.now()/1000,x:0,y:0,op:0
  };p.x=p.originX;p.y=p.originY;particles.push(p);
  if(isOneShot){const shots=particles.filter(q=>q.isOneShot&&!q.dead);if(shots.length>384){shots.sort((a,b)=>a.emitAt-b.emitAt);shots.slice(0,shots.length-384).forEach(q=>q.dead=true);}}
}
function updateStickers(dt,time){
  const b=visibleBounds();let w=0;particles.sort((a,c)=>a.originZ-c.originZ);
  for(const p of particles){
    if(!p.hasStarted)continue;const age=time-p.bornAt;
    p.y-=p.fallSpeed*dt;p.x=p.originX+Math.sin(time+p.windPhase)*p.windAmplitude;p.rotation+=p.rotationSpeed*dt;p.op=Math.min(1,age*3);
    if(p.y<-b.h/2-6){if(p.isOneShot){p.dead=true;continue;}p.originX=(Math.random()-0.5)*b.w*1.15;p.originY=b.h/2+4;p.y=p.originY;p.bornAt=time;p.idx=Math.floor(Math.random()*totalStickers());}
    if(p.dead)continue;if(w>=MAX)break;
    dummy.position.set(p.x,p.y,p.originZ);dummy.rotation.z=p.rotation;const s=p.scaleBase*P.stickerSize*p.op;dummy.scale.set(s,s,s);dummy.updateMatrix();
    sMesh.setMatrixAt(w,dummy.matrix);aIdx[w]=p.idx;aOp[w]=p.op;w++;
  }
  sMesh.count=w;sMesh.instanceMatrix.needsUpdate=true;sGeo.attributes.aIdx.needsUpdate=true;sGeo.attributes.aOp.needsUpdate=true;
}
for(let i=0;i<P.ambientCount;i++){spawn(null,false);const p=particles[particles.length-1];p.bornAt-=Math.random()*8;p.y=p.originY-Math.random()*visibleBounds().h;}

/* ============================================================
 *  鼠标跟随正弦扭曲 shader（沿用 haoqi 风格）
 * ============================================================ */
const dU={tInput:{value:fbo.texture},uTime:{value:0},uPos:{value:new THREE.Vector2(0.5,0.5)},
  uMousePos:{value:new THREE.Vector2(0.5,0.5)},uTrackMouse:{value:1},
  uResolution:{value:new THREE.Vector2(innerWidth,innerHeight)},
  uFrequency:{value:0.55},uAmplitude:{value:P.amplitude},uRotation:{value:0},uMixRadius:{value:P.mixRadius}};
const distortMat=new THREE.ShaderMaterial({
  uniforms:dU,depthTest:false,depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`precision mediump float;varying vec2 vUv;uniform sampler2D tInput;
    uniform float uFrequency,uAmplitude,uRotation,uTime,uMixRadius,uTrackMouse;uniform vec2 uResolution,uMousePos,uPos;
    void main(){vec2 uv=vUv;vec2 w=vUv*2.0-1.0;float time=uTime*0.25;float freq=20.0*uFrequency;float amp=uAmplitude*0.2;
    float wx=sin((w.y+uPos.y)*freq+time)*amp;float wy=sin((w.x-uPos.x)*freq+time)*amp;
    w.xy+=vec2(mix(wx,0.,uRotation),mix(0.,wy,uRotation));vec2 f=w*0.5+0.5;
    float aspect=uResolution.x/uResolution.y;vec2 m=uPos+mix(vec2(0.),(uMousePos-0.5),uTrackMouse);
    float dist=max(0.,1.-distance(uv*vec2(aspect,1.),m*vec2(aspect,1.))*4.*(1.-uMixRadius));
    uv=mix(uv,f,dist);gl_FragColor=texture2D(tInput,uv);}`
});
const quadScene=new THREE.Scene();quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),distortMat));
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* ============================================================
 *  交互：移动鼠标扭曲跟随 + 点击爆发贴纸
 * ============================================================ */
const pointer=new THREE.Vector2(0,0);          // 归一化 -1..1
const ndc=new THREE.Vector2();const raycaster=new THREE.Raycaster();
addEventListener('pointermove',e=>{pointer.set((e.clientX/innerWidth)*2-1,-((e.clientY/innerHeight)*2-1));});
addEventListener('pointerdown',e=>{
  ndc.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);raycaster.setFromCamera(ndc,camera);
  const o=raycaster.ray.origin,d=raycaster.ray.direction,t=-o.z/d.z;
  const hit=new THREE.Vector3().copy(o).addScaledVector(d,t);
  for(let i=0;i<P.burstCount;i++)spawn(hit,true);
});

/* ============================================================
 *  lil-gui 可视化调试面板
 * ============================================================ */
const gui=new GUI({title:'Sticker Fall 调试台'});

const fCam=gui.addFolder('Camera 相机');
fCam.add(P,'fov',20,90,1).name('fov 视场').onChange(v=>{camera.fov=v;camera.updateProjectionMatrix();});

const fStk=gui.addFolder('Stickers 贴纸');
fStk.add(P,'ambientCount',0,300,1).name('ambient 总数').onChange(syncAmbient);
fStk.add(P,'stickerSize',0.2,3,0.05).name('stickerSize 单贴尺寸').listen();
fStk.add(P,'sizeVariance',0,1,0.05).name('sizeVariance 大小随机');
fStk.add(P,'fallSpeed',0.5,5,0.1).name('fallSpeed 下落');
fStk.add(P,'windStrength',0,3,0.1).name('wind 风摆');
fStk.add(P,'burstCount',2,40,1).name('burst 爆发数');
fStk.add({up:()=>document.getElementById('stickerUpload').click()},'up').name('＋上传图片(整体替换)');
fStk.add({up:()=>document.getElementById('stickerFolder').click()},'up').name('＋上传文件夹(整体替换)');
fStk.add({def:restoreDefault},'def').name('↺恢复默认贴纸');
fStk.add(P,'stickerCount').name('sticker 贴纸种类数').listen().disable();

const fBg=gui.addFolder('Background 背景扭曲');
fBg.add(P,'mixRadius',0,1,0.01).name('mixRadius 影响半径').onChange(v=>dU.uMixRadius.value=v);
fBg.add(P,'amplitude',0,1.5,0.01).name('amplitude 扭曲强度').onChange(v=>dU.uAmplitude.value=v);

/* —— 上传图片 / 文件夹：整体替换贴纸（非追加）。纹理上限 2048²，最多 16 张 —— */
const stickerUpload=document.getElementById('stickerUpload');
const stickerFolder=document.getElementById('stickerFolder');
function showStatus(msg){ const el=document.getElementById('status'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(showStatus._t); showStatus._t=setTimeout(()=>el.classList.remove('show'),3200); }
function loadImages(files){
  const imgs=Array.from(files).filter(f=>!f.type || f.type.startsWith('image/'));
  const urls=imgs.map(f=>URL.createObjectURL(f));
  return Promise.allSettled(imgs.map((f,i)=>new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=()=>rej(new Error('decode failed')); img.src=urls[i]; })))
    .then(results=>{ const ok=[]; let skipped=0; results.forEach(r=>{ r.status==='fulfilled'?ok.push(r.value):skipped++; }); urls.forEach(u=>URL.revokeObjectURL(u)); return {ok,skipped}; });
}
function drawImageCell(ctx,img,cell){
  const col=cell%COLS, row=Math.floor(cell/COLS), x=col*CELL, y=row*CELL;
  ctx.save(); ctx.translate(x+CELL/2, y+CELL/2);
  ctx.beginPath(); ctx.arc(0,0,190,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=10; ctx.strokeStyle='#1c1c1c'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,150,0,Math.PI*2); ctx.fillStyle='#f0efe9'; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,150,0,Math.PI*2); ctx.clip();
  const iw=img.width||512, ih=img.height||512, s=Math.max(iw,ih);
  const dw=iw/s*300, dh=ih/s*300;
  ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  ctx.restore(); ctx.restore();
}
function rebuildAtlas(){
  const ctx=atlasCtx; ctx.clearRect(0,0,atlasCanvas.width,atlasCanvas.height);
  if(customImages.length>0){ customImages.forEach((img,i)=>drawImageCell(ctx,img,i)); }
  else { drawDefault(ctx); }
  atlas.needsUpdate=true;
}
function applyImages(res){
  if(!res.ok.length){ showStatus('没有可加载的图片（格式可能不支持，如 HEIC）'); return; }
  let arr=res.ok.slice();
  if(arr.length>MAX_STICKERS){ arr=arr.slice(0,MAX_STICKERS); }
  customImages=arr; rebuildAtlas();
  particles.forEach(p=>{ if(!p.dead) p.idx=Math.floor(Math.random()*totalStickers()); });
  P.stickerCount=arr.length;
  showStatus('已用 '+arr.length+' 张图片整体替换贴纸'+(res.skipped?('，跳过 '+res.skipped+' 张'):''));
}
function restoreDefault(){ customImages=[]; rebuildAtlas(); particles.forEach(p=>{ if(!p.dead) p.idx=Math.floor(Math.random()*totalStickers()); }); P.stickerCount=12; showStatus('已恢复默认 12 款贴纸'); }
stickerUpload.addEventListener('change',e=>{ loadImages(e.target.files).then(applyImages); e.target.value=''; });
stickerFolder.addEventListener('change',e=>{ loadImages(e.target.files).then(applyImages); e.target.value=''; });

function syncAmbient(){
  const cur=particles.filter(p=>!p.isOneShot&&!p.dead);
  while(cur.length<P.ambientCount){                  // 增加：补到目标数
    spawn(null,false);const p=particles[particles.length-1];
    p.bornAt-=Math.random()*8;p.y=p.originY-Math.random()*visibleBounds().h;cur.push(p);
  }
  if(cur.length>P.ambientCount){                      // 减少：多余的标记移除
    cur.slice(P.ambientCount).forEach(p=>p.dead=true);
  }
}

/* ============================================================
 *  主循环
 * ============================================================ */
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);const time=performance.now()/1000;

  updateStickers(dt,time);

  // 扭曲 shader 鼠标位置
  dU.uMousePos.value.lerp(new THREE.Vector2(pointer.x*0.5+0.5,pointer.y*0.5+0.5),0.06);
  dU.uTime.value=time;

  // 渲染：场景→FBO→扭曲→屏幕
  renderer.setRenderTarget(fbo);renderer.render(scene,camera);renderer.setRenderTarget(null);
  renderer.render(quadScene,quadCam);
}

/* ============================================================
 *  加载条 + resize
 * ============================================================ */
const loaderFillEl=document.getElementById('loaderFill');const loader=document.getElementById('loader');
let prog=0;const t=setInterval(()=>{prog=Math.min(100,prog+12+Math.random()*18);loaderFillEl.style.width=prog+'%';
  if(prog>=100){clearInterval(t);setTimeout(()=>{loader.classList.add('done');tick();},350);}},140);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);fbo.setSize(innerWidth,innerHeight);
  dU.uResolution.value.set(innerWidth,innerHeight);
});
</script>
